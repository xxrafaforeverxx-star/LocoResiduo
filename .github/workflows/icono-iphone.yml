name: Generar icono iPhone
on:
  workflow_dispatch:
  push:
    paths:
      - icon.svg
      - .github/workflows/icono-iphone.yml
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generar iconos PNG
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          for size, filename in [(180,'icon-180.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              cairosvg.svg2png(url='icon.svg',write_to=filename,output_width=size,output_height=size)
          PY
      - name: Guardar iconos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Generate iPhone icon PNG assets" && git push)
